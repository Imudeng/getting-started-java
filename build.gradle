plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:6.1.3",
            "io.qameta.allure:allure-jupiter:3.1.1",
            "io.qameta.allure:allure-selenide:3.1.1")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.aspectj:aspectjweaver:1.9.27"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
    systemProperty "junit.jupiter.extensions.autodetection.enabled", "true"
    jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.startsWith('aspectjweaver') }}"
    doFirst {
        delete "allure-results"
    }
    systemProperty "baseUrl", System.getProperty("baseUrl", "https://github.com")
    systemProperty "browser", System.getProperty("browser", "chrome")
    systemProperty "browserSize", System.getProperty("browserSize", "1920x1080")
    systemProperty "headless", System.getProperty("headless", "false")
    systemProperty "remote", System.getProperty("remote", "")
    systemProperty "browserVersion", System.getProperty("browserVersion", "")
}
